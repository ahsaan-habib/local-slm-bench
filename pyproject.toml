[project]
name = "local-slm-bench"
version = "0.1.0"
description = "Benchmarking small local LLMs on one machine: TTFT, decode t/s, memory, schema compliance"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "psutil>=5.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slm*", "bench*"]
